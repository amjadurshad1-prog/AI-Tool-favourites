<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AI Tools Favourites</title>
<meta name="description" content="Quick-launch your favourite AI tools from one place."/>
<meta name="theme-color" content="#6c63ff"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="AI Tools"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="https://emojicdn.elk.sh/🚀?style=apple"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#eeeeed;--text:#1a1a18;--text2:#6b6b67;--text3:#a3a39f;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);
  --accent:#6c63ff;--accent-bg:rgba(108,99,255,0.1);--accent-border:rgba(108,99,255,0.3);
  --danger:#e24b4a;--hot-bg:#fff0e0;--hot-text:#c05c00;
  --card-shadow:0 1px 3px rgba(0,0,0,0.06);
  --radius:10px;--radius-lg:16px;--radius-xl:20px;
}
[data-theme="dark"]{
  --bg:#18181b;--bg2:#1f1f23;--bg3:#2a2a2f;--text:#f4f3ff;--text2:#a09fbc;--text3:#6b6a80;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --accent:#8b85ff;--accent-bg:rgba(139,133,255,0.12);--accent-border:rgba(139,133,255,0.3);
  --danger:#ff8080;--hot-bg:#3d2000;--hot-text:#ffb347;
  --card-shadow:0 1px 4px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0;transition:background-color .2s,border-color .2s,color .15s;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg2);color:var(--text);min-height:100vh;}

/* INSTALL BANNER */
.install-banner{display:none;background:linear-gradient(135deg,#6c63ff,#8b5cf6);color:#fff;padding:11px 1rem;align-items:center;gap:10px;}
.install-banner.show{display:flex;}
.install-banner p{flex:1;font-size:13px;font-weight:500;line-height:1.3;}
.install-banner p span{font-size:11px;opacity:.8;}
.install-banner .ibtn{background:rgba(255,255,255,0.25);border:0.5px solid rgba(255,255,255,0.4);color:#fff;padding:6px 13px;border-radius:100px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;}
.install-banner .xbtn{background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;padding:0 2px;flex-shrink:0;}

/* HEADER */
header{background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 1rem;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;gap:8px;}
.header-left{display:flex;align-items:center;gap:8px;}
header h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap;}
header h1 i{font-size:19px;color:var(--accent);}
.header-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.icon-btn{background:none;border:0.5px solid var(--border);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:16px;flex-shrink:0;transition:background .15s;}
.icon-btn:hover{background:var(--bg2);}

/* STATS BAR */
.stats-bar{display:flex;gap:0;background:var(--bg);border-bottom:0.5px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.stats-bar::-webkit-scrollbar{display:none;}
.stat-item{flex:1;min-width:90px;padding:.75rem .5rem;text-align:center;border-right:0.5px solid var(--border);}
.stat-item:last-child{border-right:none;}
.stat-num{font-size:1.3rem;font-weight:800;color:var(--accent);line-height:1;font-family:-apple-system,sans-serif;}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:2px;white-space:nowrap;}

main{max-width:840px;margin:0 auto;padding:1rem 1rem 5rem;}

/* SEARCH */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:0 12px;margin-bottom:.9rem;box-shadow:var(--card-shadow);}
.search-bar i{color:var(--text3);font-size:15px;}
.search-bar input{border:none;outline:none;background:transparent;font-size:14px;color:var(--text);padding:10px 0;width:100%;font-family:inherit;}
.search-bar input::placeholder{color:var(--text3);}

/* CATS */
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.9rem;}
.cat-btn{background:var(--bg);border:0.5px solid var(--border);border-radius:100px;padding:5px 14px;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.cat-btn.active,.cat-btn:hover{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent);}

.section-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:1.2rem 0 .6rem;display:flex;align-items:center;gap:6px;}
.section-label::after{content:'';flex:1;height:0.5px;background:var(--border);}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;}

/* CARD COLOURS */
.card{border-radius:var(--radius-lg);padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative;-webkit-tap-highlight-color:transparent;box-shadow:var(--card-shadow);border:0.5px solid transparent;transition:transform .12s,box-shadow .12s;}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.1);}
.card:active{transform:scale(0.96);}

/* colour themes per category */
.card[data-cat="Chat"]{background:linear-gradient(135deg,#f0f0ff,#e8e6ff);border-color:rgba(108,99,255,0.2);}
.card[data-cat="Image"]{background:linear-gradient(135deg,#fff0f8,#fde8f5);border-color:rgba(255,107,157,0.2);}
.card[data-cat="Video"]{background:linear-gradient(135deg,#fff5e6,#fdebd0);border-color:rgba(255,159,67,0.2);}
.card[data-cat="Coding"]{background:linear-gradient(135deg,#e8fff5,#d5f5e8);border-color:rgba(0,212,130,0.2);}
.card[data-cat="Writing"]{background:linear-gradient(135deg,#f0f8ff,#daeeff);border-color:rgba(52,152,219,0.2);}
.card[data-cat="Audio"]{background:linear-gradient(135deg,#fff0ff,#f8e0ff);border-color:rgba(155,89,182,0.2);}
.card[data-cat="Research"]{background:linear-gradient(135deg,#f0fff4,#d5f5dc);border-color:rgba(39,174,96,0.2);}
.card[data-cat="Agents"]{background:linear-gradient(135deg,#fff8e1,#fdefc3);border-color:rgba(243,156,18,0.2);}
.card[data-cat="Other"]{background:var(--bg);border-color:var(--border);}

[data-theme="dark"] .card[data-cat="Chat"]{background:linear-gradient(135deg,#1e1b3a,#221e45);}
[data-theme="dark"] .card[data-cat="Image"]{background:linear-gradient(135deg,#2d1a2a,#381e33);}
[data-theme="dark"] .card[data-cat="Video"]{background:linear-gradient(135deg,#2d2010,#38280d);}
[data-theme="dark"] .card[data-cat="Coding"]{background:linear-gradient(135deg,#0f2820,#122e24);}
[data-theme="dark"] .card[data-cat="Writing"]{background:linear-gradient(135deg,#101e30,#122336);}
[data-theme="dark"] .card[data-cat="Audio"]{background:linear-gradient(135deg,#22103a,#2a1245);}
[data-theme="dark"] .card[data-cat="Research"]{background:linear-gradient(135deg,#0f2a18,#10301c);}
[data-theme="dark"] .card[data-cat="Agents"]{background:linear-gradient(135deg,#28200a,#30260c);}
[data-theme="dark"] .card[data-cat="Other"]{background:var(--bg3);}

.card .emoji{font-size:26px;line-height:1;margin-bottom:3px;}
.card .name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .url{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:100px;margin-top:4px;background:rgba(0,0,0,0.07);color:var(--text2);width:fit-content;}
[data-theme="dark"] .card .tag{background:rgba(255,255,255,0.08);}
.card .hot{display:inline-block;font-size:10px;padding:2px 8px;border-radius:100px;margin-top:2px;background:var(--hot-bg);color:var(--hot-text);width:fit-content;font-weight:600;}
.card .sponsored-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:100px;margin-top:2px;background:#fff3e0;color:#e65100;width:fit-content;font-weight:600;}
[data-theme="dark"] .card .sponsored-tag{background:#3d1a00;color:#ffb74d;}

/* action buttons on card */
.card-actions{position:absolute;top:7px;right:7px;display:flex;gap:4px;opacity:0;transition:opacity .15s;}
.card:hover .card-actions{opacity:1;}
.card-act{background:rgba(255,255,255,0.8);border:none;cursor:pointer;color:var(--text2);font-size:13px;padding:4px;border-radius:6px;line-height:1;display:flex;align-items:center;justify-content:center;}
[data-theme="dark"] .card-act{background:rgba(0,0,0,0.4);}
.card-act:hover{color:var(--accent);}
.card-act.del:hover{color:var(--danger);}

/* RECENT SECTION */
.recent-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:.5rem;}
.recent-scroll::-webkit-scrollbar{display:none;}
.recent-chip{display:flex;align-items:center;gap:6px;background:var(--bg);border:0.5px solid var(--border);border-radius:100px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:12px;color:var(--text2);flex-shrink:0;transition:all .15s;box-shadow:var(--card-shadow);}
.recent-chip:hover{border-color:var(--accent-border);color:var(--accent);background:var(--accent-bg);}
.recent-chip .re{font-size:15px;}

.add-card{background:transparent;border:0.5px dashed var(--border2);border-radius:var(--radius-lg);padding:14px 12px;cursor:pointer;color:var(--text3);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:95px;transition:all .15s;font-family:inherit;-webkit-tap-highlight-color:transparent;}
.add-card i{font-size:20px;}
.add-card:hover{background:var(--bg);border-color:var(--accent-border);color:var(--accent);}
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px;}
.empty i{font-size:32px;display:block;margin-bottom:8px;}

.fab{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--accent);color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(108,99,255,0.4);transition:transform .15s;z-index:20;}
.fab:active{transform:scale(0.92);}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:flex-end;justify-content:center;}
@media(min-width:520px){.modal-bg{align-items:center;padding:1rem;}}
.modal-bg.open{display:flex;}
.modal{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:1.5rem 1.25rem 2rem;width:100%;max-width:400px;animation:slideUp .22s ease;}
@media(min-width:520px){.modal{border-radius:var(--radius-xl);padding:1.5rem;}}
@keyframes slideUp{from{transform:translateY(50px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 1.25rem;}
@media(min-width:520px){.modal-handle{display:none;}}
.modal h2{font-size:16px;font-weight:700;margin-bottom:1.1rem;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500;}
.field input{width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:9px 12px;font-size:14px;color:var(--text);outline:none;font-family:inherit;}
.field input:focus{border-color:var(--accent-border);background:var(--bg);}
.emoji-row{display:flex;flex-wrap:wrap;gap:6px;}
.ep{background:none;border:0.5px solid var(--border);border-radius:8px;padding:5px 8px;cursor:pointer;font-size:20px;line-height:1;}
.ep:hover,.ep.sel{background:var(--accent-bg);border-color:var(--accent-border);}
.mbtns{display:flex;gap:8px;margin-top:1.1rem;}
.mbtns button{flex:1;padding:11px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
#cancel-btn{background:var(--bg2);border:0.5px solid var(--border);color:var(--text2);}
#save-btn{background:var(--accent);border:none;color:#fff;}

/* SHARE MODAL */
.share-modal{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:1.5rem 1.25rem 2rem;width:100%;max-width:400px;animation:slideUp .22s ease;}
@media(min-width:520px){.share-modal{border-radius:var(--radius-xl);}}
.share-tool-name{font-size:18px;font-weight:700;margin-bottom:.25rem;display:flex;align-items:center;gap:8px;}
.share-tool-url{font-size:12px;color:var(--text3);margin-bottom:1.25rem;}
.share-options{display:flex;flex-direction:column;gap:8px;}
.share-opt{display:flex;align-items:center;gap:12px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:13px 14px;cursor:pointer;transition:all .15s;}
.share-opt:hover{border-color:var(--accent-border);background:var(--accent-bg);}
.share-opt i{font-size:20px;color:var(--accent);}
.share-opt div{flex:1;}
.share-opt strong{font-size:13px;font-weight:600;display:block;}
.share-opt span{font-size:11px;color:var(--text3);}

.toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 20px;border-radius:100px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:300;white-space:nowrap;font-weight:500;}
.toast.show{opacity:1;}
.offline-bar{display:none;background:#e74c3c;color:#fff;text-align:center;padding:6px;font-size:12px;font-weight:500;}
.offline-bar.show{display:block;}
</style>
</head>
<body>
<div class="offline-bar" id="offline-bar">📵 Offline — app still works!</div>
<div class="install-banner" id="install-banner">
  <p>📱 Add to Home Screen <span>Use like a real app — free!</span></p>
  <button class="ibtn" id="install-accept">Install</button>
  <button class="xbtn" id="install-close">✕</button>
</div>

<header>
  <div class="header-left">
    <h1><i class="ti ti-rocket"></i> AI Tools</h1>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="theme-btn" title="Toggle theme"><i class="ti ti-moon" id="theme-icon"></i></button>
    <button class="icon-btn" id="install-btn-small" style="display:none" title="Install app"><i class="ti ti-download"></i></button>
  </div>
</header>

<!-- STATS BAR -->
<div class="stats-bar" id="stats-bar">
  <div class="stat-item"><div class="stat-num" id="s-total">0</div><div class="stat-lbl">Total Tools</div></div>
  <div class="stat-item"><div class="stat-num" id="s-cats">0</div><div class="stat-lbl">Categories</div></div>
  <div class="stat-item"><div class="stat-num" id="s-trending">0</div><div class="stat-lbl">Trending 🔥</div></div>
  <div class="stat-item"><div class="stat-num" id="s-recent">0</div><div class="stat-lbl">Used Today</div></div>
</div>

<main>
  <div class="search-bar">
    <i class="ti ti-search"></i>
    <input id="search" type="text" placeholder="Search any AI tool…"/>
  </div>
  <div class="cats" id="cats"></div>
  <div id="grid-wrap"></div>
</main>

<button class="fab" id="fab-btn"><i class="ti ti-plus"></i></button>
<div class="toast" id="toast"></div>

<!-- ADD/EDIT MODAL -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="modal-title">Add Tool</h2>
    <div class="field"><label>Icon</label><div class="emoji-row" id="emoji-row"></div></div>
    <div class="field"><label>Tool name</label><input id="f-name" type="text" placeholder="e.g. ChatGPT" autocomplete="off"/></div>
    <div class="field"><label>URL</label><input id="f-url" type="url" placeholder="https://..." autocomplete="off"/></div>
    <div class="field"><label>Category</label><input id="f-cat" type="text" placeholder="e.g. Chat, Image, Coding…" autocomplete="off"/></div>
    <div class="mbtns"><button id="cancel-btn">Cancel</button><button id="save-btn">Save ✓</button></div>
  </div>
</div>

<!-- SHARE MODAL -->
<div class="modal-bg" id="share-modal-bg">
  <div class="share-modal">
    <div class="modal-handle"></div>
    <div class="share-tool-name" id="share-tool-name"></div>
    <div class="share-tool-url" id="share-tool-url"></div>
    <div class="share-options">
      <div class="share-opt" id="share-native"><i class="ti ti-share"></i><div><strong>Share link</strong><span>Send via WhatsApp, iMessage, email…</span></div></div>
      <div class="share-opt" id="share-copy"><i class="ti ti-copy"></i><div><strong>Copy link</strong><span>Copy tool URL to clipboard</span></div></div>
      <div class="share-opt" id="share-cancel-opt"><i class="ti ti-x"></i><div><strong>Cancel</strong><span></span></div></div>
    </div>
  </div>
</div>

<script>
const EMOJIS=['🤖','✨','🧠','💬','🎨','🖼️','🔍','📝','💻','🎵','🎬','📊','🌐','⚡','🔧','📧','📷','🗂️','🧩','🚀','🎯','🛠️','📱','🌟','🔮','🎤','📈','🧬','🖊️','🗣️'];
const SPONSORED=[

const DEFAULTS=[

  {id:'23',name:'Jasper',url:'https://jasper.ai',emoji:'🖊️',cat:'Writing',hot:false},

  {id:'26',name:'Udio',url:'https://udio.com',emoji:'🎶',cat:'Audio',hot:false},
  {id:'27',name:'Manus AI',url:'https://manus.im',emoji:'🤝',cat:'Agents',hot:true},
  {id:'28',name:'n8n',url:'https://n8n.io',emoji:'🔧',cat:'Agents',hot:true},
  {id:'29',name:'Make',url:'https://make.com',emoji:'⚙️',cat:'Agents',hot:false},
  {id:'30',name:'Zapier AI',url:'https://zapier.com',emoji:'⚡',cat:'Agents',hot:false},
];

let tools=[],activeCat='All',editId=null,selEmoji=EMOJIS[0],searchQ='';
let recentIds=[],deferredPrompt=null,shareTarget=null;

// THEME
let theme=localStorage.getItem('ai-theme')||'auto';
function applyTheme(){
  const isDark=theme==='dark'||(theme==='auto'&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.setAttribute('data-theme',isDark?'dark':'light');
  document.getElementById('theme-icon').className=isDark?'ti ti-sun':'ti ti-moon';
}
applyTheme();
document.getElementById('theme-btn').onclick=()=>{
  theme=theme==='dark'?'light':'dark';
  localStorage.setItem('ai-theme',theme);applyTheme();
};
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(theme==='auto')applyTheme();});

// PWA
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById('install-banner').classList.add('show');
  document.getElementById('install-btn-small').style.display='flex';
});
function triggerInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==='accepted'){document.getElementById('install-banner').classList.remove('show');document.getElementById('install-btn-small').style.display='none';showToast('App installed! 🎉');}deferredPrompt=null;});}
document.getElementById('install-accept').onclick=triggerInstall;
document.getElementById('install-btn-small').onclick=triggerInstall;
document.getElementById('install-close').onclick=()=>document.getElementById('install-banner').classList.remove('show');
window.addEventListener('online',()=>document.getElementById('offline-bar').classList.remove('show'));
window.addEventListener('offline',()=>document.getElementById('offline-bar').classList.add('show'));
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

function load(){
  try{const s=localStorage.getItem('ai-fav-tools-v2');tools=s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULTS));}
  catch(e){tools=JSON.parse(JSON.stringify(DEFAULTS));}
  try{recentIds=JSON.parse(localStorage.getItem('ai-recent')||'[]');}catch(e){recentIds=[];}
  render();
}
function save(){try{localStorage.setItem('ai-fav-tools-v2',JSON.stringify(tools));}catch(e){}}
function saveRecent(){try{localStorage.setItem('ai-recent',JSON.stringify(recentIds));}catch(e){}}

function addRecent(id){recentIds=recentIds.filter(x=>x!==id);recentIds.unshift(id);if(recentIds.length>8)recentIds=recentIds.slice(0,8);saveRecent();}

function getCats(){return['All',...new Set(tools.map(t=>t.cat||'Other'))];}

function updateStats(){
  const cats=new Set(tools.map(t=>t.cat||'Other'));
  const trending=tools.filter(t=>t.hot).length;
  const usedToday=recentIds.filter(id=>tools.find(t=>t.id===id)).length;
  document.getElementById('s-total').textContent=tools.length;
  document.getElementById('s-cats').textContent=cats.size;
  document.getElementById('s-trending').textContent=trending;
  document.getElementById('s-recent').textContent=usedToday;
}

function render(){
  let list=tools;
  if(activeCat!=='All')list=list.filter(t=>(t.cat||'Other')===activeCat);
  if(searchQ)list=list.filter(t=>t.name.toLowerCase().includes(searchQ.toLowerCase())||(t.cat||'').toLowerCase().includes(searchQ.toLowerCase()));
  updateStats();
  catsEl.innerHTML='';
  getCats().forEach(c=>{
    const b=document.createElement('button');b.className='cat-btn'+(c===activeCat?' active':'');
    b.textContent=c;b.onclick=()=>{activeCat=c;render();};catsEl.appendChild(b);
  });
  gridWrap.innerHTML='';

  // RECENTLY USED
  const recentTools=recentIds.map(id=>tools.find(t=>t.id===id)).filter(Boolean);
  if(recentTools.length&&activeCat==='All'&&!searchQ){
    const lbl=document.createElement('div');lbl.className='section-label';lbl.textContent='🕐 Recently Used';gridWrap.appendChild(lbl);
    const scroll=document.createElement('div');scroll.className='recent-scroll';
    recentTools.forEach(t=>{
      const chip=document.createElement('div');chip.className='recent-chip';
      chip.innerHTML=`<span class="re">${t.emoji||'🔧'}</span>${t.name}`;
      chip.onclick=()=>openTool(t);scroll.appendChild(chip);
    });
    gridWrap.appendChild(scroll);
  }

  if(list.length===0){
    const g=document.createElement('div');g.className='grid';
    const e=document.createElement('div');e.className='empty';e.innerHTML='<i class="ti ti-bookmark"></i>No tools found';
    g.appendChild(e);gridWrap.appendChild(g);return;
  }

  if(activeCat==='All'&&!searchQ){
    if(SPONSORED.length){
      const lbl=document.createElement('div');lbl.className='section-label';lbl.textContent='⭐ Featured';gridWrap.appendChild(lbl);
      const g=document.createElement('div');g.className='grid';
      SPONSORED.forEach(t=>g.appendChild(makeCard(t)));gridWrap.appendChild(g);
    }
    const grouped={};
    list.forEach(t=>{const c=t.cat||'Other';if(!grouped[c])grouped[c]=[];grouped[c].push(t);});
    Object.entries(grouped).forEach(([cat,items])=>{
      const lbl=document.createElement('div');lbl.className='section-label';lbl.textContent=cat;gridWrap.appendChild(lbl);
      const g=document.createElement('div');g.className='grid';
      items.forEach(t=>g.appendChild(makeCard(t)));g.appendChild(makeAddBtn());gridWrap.appendChild(g);
    });
  }else{
    const g=document.createElement('div');g.className='grid';
    list.forEach(t=>g.appendChild(makeCard(t)));g.appendChild(makeAddBtn());gridWrap.appendChild(g);
  }
}

function makeCard(t){
  const c=document.createElement('div');c.className='card';
  c.setAttribute('data-cat',t.cat||'Other');
  c.setAttribute('role','link');c.setAttribute('tabindex','0');
  const badge=t.sponsored?`<span class="sponsored-tag">⭐ Featured</span>`:t.hot?`<span class="hot">🔥 Trending</span>`:'';
  const actions=t.sponsored?'':`<div class="card-actions"><button class="card-act" title="Share" onclick="openShare('${t.id}',event)"><i class="ti ti-share"></i></button><button class="card-act del" title="Remove" onclick="removeT('${t.id}',event)"><i class="ti ti-x"></i></button></div>`;
  c.innerHTML=`<span class="emoji">${t.emoji||'🔧'}</span><span class="name">${t.name}</span><span class="url">${(t.url||'').replace(/^https?:\/\//,'')}</span>${t.cat?`<span class="tag">${t.cat}</span>`:''}${badge}${actions}`;
  c.onclick=(e)=>{if(!e.target.closest('.card-actions'))openTool(t);};
  c.onkeydown=(e)=>{if(e.key==='Enter')openTool(t);};
  return c;
}

function makeAddBtn(){
  const a=document.createElement('button');a.className='add-card';
  a.innerHTML='<i class="ti ti-plus"></i><span>Add tool</span>';a.onclick=()=>openModal();return a;
}

function openTool(t){
  if(!t.url)return;
  addRecent(t.id);updateStats();
  window.open(t.url.match(/^https?:\/\//)?t.url:'https://'+t.url,'_blank','noopener');
}

function removeT(id,e){e.stopPropagation();tools=tools.filter(t=>t.id!==id);recentIds=recentIds.filter(x=>x!==id);save();saveRecent();render();showToast('Removed');}

// SHARE
function openShare(id,e){
  e.stopPropagation();
  const t=tools.find(x=>x.id===id);if(!t)return;
  shareTarget=t;
  document.getElementById('share-tool-name').innerHTML=`${t.emoji} ${t.name}`;
  document.getElementById('share-tool-url').textContent=(t.url||'').replace(/^https?:\/\//,'');
  document.getElementById('share-modal-bg').classList.add('open');
}
document.getElementById('share-native').onclick=()=>{
  if(!shareTarget)return;
  const url=shareTarget.url.match(/^https?:\/\//)?shareTarget.url:'https://'+shareTarget.url;
  if(navigator.share){navigator.share({title:shareTarget.name,text:`Check out ${shareTarget.name} — an awesome AI tool!`,url}).catch(()=>{});}
  else{navigator.clipboard.writeText(url).then(()=>showToast('Link copied!'));}
  document.getElementById('share-modal-bg').classList.remove('open');
};
document.getElementById('share-copy').onclick=()=>{
  if(!shareTarget)return;
  const url=shareTarget.url.match(/^https?:\/\//)?shareTarget.url:'https://'+shareTarget.url;
  navigator.clipboard.writeText(url).then(()=>showToast('Link copied! ✅'));
  document.getElementById('share-modal-bg').classList.remove('open');
};
document.getElementById('share-cancel-opt').onclick=()=>document.getElementById('share-modal-bg').classList.remove('open');
document.getElementById('share-modal-bg').onclick=(e)=>{if(e.target===document.getElementById('share-modal-bg'))document.getElementById('share-modal-bg').classList.remove('open');};

function openModal(id){
  editId=id||null;const t=id?tools.find(x=>x.id===id):null;
  document.getElementById('modal-title').textContent=id?'Edit Tool':'Add Tool';
  document.getElementById('f-name').value=t?t.name:'';
  document.getElementById('f-url').value=t?t.url:'';
  document.getElementById('f-cat').value=t?t.cat:'';
  selEmoji=t?t.emoji:EMOJIS[0];
  emojiRow.innerHTML='';
  EMOJIS.forEach(em=>{
    const b=document.createElement('button');b.className='ep'+(em===selEmoji?' sel':'');b.textContent=em;b.type='button';
    b.onclick=()=>{selEmoji=em;emojiRow.querySelectorAll('.ep').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
    emojiRow.appendChild(b);
  });
  document.getElementById('modal-bg').classList.add('open');setTimeout(()=>document.getElementById('f-name').focus(),100);
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

document.getElementById('cancel-btn').onclick=()=>document.getElementById('modal-bg').classList.remove('open');
document.getElementById('fab-btn').onclick=()=>openModal();
document.getElementById('modal-bg').onclick=(e)=>{if(e.target===document.getElementById('modal-bg'))document.getElementById('modal-bg').classList.remove('open');};
document.getElementById('save-btn').onclick=()=>{
  const name=document.getElementById('f-name').value.trim();
  let url=document.getElementById('f-url').value.trim();
  const cat=document.getElementById('f-cat').value.trim()||'Other';
  if(!name){document.getElementById('f-name').focus();return;}
  if(url&&!url.match(/^https?:\/\//))url='https://'+url;
  if(editId){const t=tools.find(x=>x.id===editId);if(t){t.name=name;t.url=url;t.cat=cat;t.emoji=selEmoji;}}
  else tools.push({id:Date.now().toString(),name,url,cat,emoji:selEmoji,hot:false});
  save();render();document.getElementById('modal-bg').classList.remove('open');showToast(editId?'Updated! ✓':'Added! ✅');
};
document.getElementById('f-name').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('save-btn').click();});
document.getElementById('search').addEventListener('input',e=>{searchQ=e.target.value;render();});

const gridWrap=document.getElementById('grid-wrap');
const catsEl=document.getElementById('cats');
const emojiRow=document.getElementById('emoji-row');
load();
</script>
</body>
</html>
